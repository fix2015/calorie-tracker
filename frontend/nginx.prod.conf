server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (JS/CSS/JSON/SVG). Previously the ~1 MB JS bundle was served
    # uncompressed, which dominated first paint on mobile networks.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    # The host nginx proxies to this container over HTTP/1.0; gzip defaults to 1.1-only
    gzip_http_version 1.0;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    # index.html and sw.js — never cache (must always fetch latest)
    location ~ ^/(index\.html|sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Vite hashed assets — cache forever (hash changes on rebuild)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — all routes serve index.html (no-cache)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
