# ============================================================
# Nginx server block for calories.probooking.app
# Place this as /etc/nginx/sites-available/calories.probooking.app
# then: ln -s /etc/nginx/sites-available/calories.probooking.app /etc/nginx/sites-enabled/
# then: sudo bash /var/www/prof-booking/infra/fix-ssl-all-domains.sh you@email.com   (one cert for all probooking.app hosts)
# then: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name calories.probooking.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calories.probooking.app;

    # certbot manages these (see salon-nail-app/infra/fix-ssl-all-domains.sh)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_certificate /etc/letsencrypt/live/probooking.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probooking.app/privkey.pem;

    client_max_body_size 10m;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded photos
    location /uploads/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
    }

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
